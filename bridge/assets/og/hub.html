<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>공유 미리보기 그림(메인) — tools/render-og.js 가 1200×630 으로 찍음</title>
<link rel="stylesheet" href="../fonts/pretendard.css">
<style>
html,body{margin:0}body{width:1200px;height:630px;overflow:hidden;font-family:"Pretendard Variable",Pretendard,sans-serif;color:#fff;
 background:radial-gradient(900px 500px at 85% 10%,#3b6cf0 0%,transparent 60%),linear-gradient(135deg,#0f1b33 0%,#16306b 60%,#2456e5 100%)}
.wrap{display:grid;grid-template-columns:470px 1fr;gap:36px;height:100%;padding:56px 56px 52px 64px;box-sizing:border-box}
.txt{display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:26px;font-weight:700;color:#bcd0ff;letter-spacing:.02em}
h1{margin:14px 0 22px;font-size:84px;line-height:1.08;font-weight:900;letter-spacing:-.02em}
.flow{display:flex;flex-direction:column;gap:10px;font-size:29px;font-weight:700}
.flow span{display:flex;align-items:center;gap:12px}.flow i{font-style:normal;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);font-size:22px}
.kits{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-content:center}
.kit{background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.35);color:#111827}
.kit .pic{height:330px;background:#eef1f7 center/cover no-repeat}
.kit .pic.dog{background:#e2e7f1 url(../../lessons/assets/sim_robodog3d.png) 60% 100%/auto 280px no-repeat}
.kit .pic.pony{background:#b9f0fd url(../../ponybot/assets/official/material-pony-v2.webp) center/108% no-repeat}
.kit b{display:block;padding:18px 22px 4px;font-size:34px;font-weight:900}
.kit small{display:block;padding:0 22px 20px;font-size:21px;font-weight:600;color:#566077}
</style></head><body><div class="wrap">
<div class="txt"><div class="eyebrow">마이크로비트 × 로봇 교구</div><h1>피지컬<br>AI 교실</h1>
<div class="flow"><span><i>👁</i>AI가 보고</span><span><i>📡</i>마이크로비트가 전하고</span><span><i>🤖</i>로봇이 움직인다</span></div></div>
<div class="kits"><div class="kit"><div class="pic dog"></div><b>빅아이 로보독</b><small>네 다리로 걷는 로봇</small></div>
<div class="kit"><div class="pic pony"></div><b>AI 포니봇</b><small>옆으로도 가는 메카넘 바퀴</small></div></div>
</div></body></html>
