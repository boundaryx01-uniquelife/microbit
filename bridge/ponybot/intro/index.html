<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 포니봇 인트로 미리 보기</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../../assets/fonts/pretendard.css"><link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="intro.css">
<script type="importmap">{ "imports": { "three": "../../sim/lib/three.module.min.js" } }</script>
<style>
html,body{margin:0;height:100%;background:#0b1220;overflow:hidden;font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif}
#stage{position:absolute;inset:0;margin:auto;aspect-ratio:16/9;max-width:100vw;max-height:100vh;width:min(100vw,177.78vh)}
.bar{position:fixed;left:16px;right:16px;bottom:14px;display:flex;gap:10px;align-items:center;color:#dfe6f3;font-size:14px;z-index:5}
.bar button{font:inherit;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid #c9d1df;background:#fff;color:#111827;cursor:pointer}
.bar input{flex:1;accent-color:#2456e5}.bar output{min-width:4.5em;text-align:right;font-variant-numeric:tabular-nums}
.cap .bar{display:none}
</style></head>
<body>
<div id="stage" role="img" aria-label="AI 포니봇 인트로: 포니봇이 몸은 앞을 본 채 옆으로 주차하고, 대각선으로 움직이고, 구불구불한 검은 선을 따라가요."></div>
<div class="bar"><button id="play" type="button">다시 재생</button><input id="tl" type="range" min="0" max="20" step="0.01" value="0" aria-label="시간"><output id="tv">0.00s</output></div>
<script type="module">
// 미리 보기·프레임 렌더용. ?t=초(그 시각에 멈춤), ?cap(조작 막대 숨김 — 영상 렌더)
import { createIntro, DUR } from './intro.js';
const q = new URLSearchParams(location.search);
if (q.has('cap')) document.documentElement.classList.add('cap');
const tl = document.getElementById('tl'), tv = document.getElementById('tv');
await document.fonts.ready;
try { await Promise.all(['800 60px "Pretendard Variable"', '600 30px "Pretendard Variable"'].map((f) => document.fonts.load(f, 'AI 포니봇 교실 ①②③ 출발 멈춰요 cm'))); } catch (e) {}
const intro = createIntro(document.getElementById('stage'), { width: 1280, height: 720 });
tl.max = DUR;
const show = () => { tl.value = intro.time; tv.textContent = intro.time.toFixed(2) + 's'; if (intro.running) requestAnimationFrame(show); };
window.__intro = intro; window.__seek = (t) => intro.seek(t);
tl.oninput = () => { intro.seek(+tl.value); show(); };
document.getElementById('play').onclick = () => { intro.restart(); show(); };
if (q.has('t')) intro.seek(+q.get('t')); else if (!q.has('cap')) { intro.restart(); }
show(); window.__ready = true;
</script>
</body></html>
