<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빅아이 로보독 · 모션 인트로</title>
<meta name="theme-color" content="#0b1020">
<link rel="stylesheet" href="assets/fonts/pretendard.css">
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #replay { position: fixed; right: 16px; bottom: 16px; font: 700 14px "Pretendard Variable", Pretendard, system-ui, sans-serif; color: #dbe6ff;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 8px 16px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .4s; }
  #replay.on { opacity: 1; pointer-events: auto; }
  #replay:hover { background: rgba(255,255,255,.16); }
  body.cap #replay { display: none; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="빅아이 로보독 로고의 눈이 켜지고 신호가 퍼지며 제목 '빅아이 로보독, 마이크로비트 피지컬 AI 수업'이 나타나는 모션 인트로"></canvas>
<button id="replay" type="button">다시 보기</button>
<script>
// 빅아이 로보독 × 마이크로비트 — 6초 모션 그래픽 인트로 (Canvas 2D, 시간 t의 순수 함수라 어느 시각이든 같은 장면)
// 시험·캡처: ?t=2.5 (정지 화면) · window.__seek(초) · ?cap (재생 UI 숨김, 캡처용)
const DUR = 6.2;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const qs = new URLSearchParams(location.search);
if (qs.has('cap')) document.body.classList.add('cap');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BLUE = '#2456e5', CYAN = '#8fd8ff', INK = '#111827', NAVY = '#0b1020';
const FONT = '"Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif';

// ---------- 보조 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eInOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eBack = (x, c = 1.9) => { x -= 1; return 1 + (c + 1) * x * x * x + c * x * x; };
const rnd = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// ---------- 화면(가상 좌표: 가로 1920×1080, 세로 1080×1920) ----------
let W = 1920, H = 1080, px = 1, portrait = false;
function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  portrait = h > w * 1.05;
  W = portrait ? 1080 : 1920; H = portrait ? 1920 : 1080;
  px = Math.max(cv.width / W, cv.height / H) === 0 ? 1 : Math.min(cv.width / W, cv.height / H);
}

// ---------- 로고 (assets/logo.svg 의 32×32 도형을 그대로 확대) ----------
// o: badge(0~1 배지 크기) face(0~1 얼굴 크기) eye(0~1 눈 열림) pupil(0~1 눈동자 켜짐) look(-1~1) blink(0~1 감김) arc(0~1)
function logo(cx, cy, size, o) {
  const k = size / 32;
  g.save(); g.translate(cx, cy); g.scale(k, k); g.translate(-16, -16);
  if (o.badge > 0.001) {
    g.save(); g.translate(16, 16); g.rotate((1 - o.badge) * -0.18); g.scale(o.badge, o.badge); g.translate(-16, -16);
    g.shadowColor = 'rgba(36,86,229,.55)'; g.shadowBlur = 28 * k * 0.5 * o.badge; g.fillStyle = BLUE; rr(0, 0, 32, 32, 9); g.fill(); g.shadowBlur = 0;
    // 배지 위의 부드러운 빛 (셀 느낌의 단순한 하이라이트)
    g.save(); rr(0, 0, 32, 32, 9); g.clip(); g.fillStyle = 'rgba(255,255,255,.10)'; g.beginPath(); g.ellipse(8, 2, 22, 11, -0.4, 0, 7); g.fill(); g.restore();
    if (o.arc > 0.001) {
      g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 1.8; g.lineCap = 'round';
      g.beginPath(); g.arc(22.2 - 0.0, 11.2, 5.6, -Math.PI / 2 + 0.0, -Math.PI / 2 + 0.0 + 1.0 * o.arc * 1.2, false); g.stroke();
    }
    if (o.face > 0.001) {
      g.save(); g.translate(16, 17); g.scale(1, o.face); g.translate(-16, -17);
      g.fillStyle = '#fff'; rr(4.5, 10.5, 23, 13, 6.5); g.fill(); g.restore();
      const eyeH = 7.6 * o.eye * (1 - o.blink * .92);
      if (eyeH > .05 && o.face > .6) {
        g.fillStyle = INK;
        rr(8, 17 - eyeH / 2, 6.6, eyeH, Math.min(2.2, eyeH / 2)); g.fill();
        rr(17.4, 17 - eyeH / 2, 6.6, eyeH, Math.min(2.2, eyeH / 2)); g.fill();
        if (o.pupil > .01) {
          const r = 1.6 * (0.55 + 0.45 * o.pupil) * (eyeH / 7.6 > .3 ? 1 : eyeH / 7.6 / .3);
          g.shadowColor = CYAN; g.shadowBlur = 14 * o.pupil; g.fillStyle = CYAN; g.globalAlpha = Math.min(1, o.pupil);
          g.beginPath(); g.arc(11.3 + o.look * 1.7, 17, r, 0, 7); g.fill();
          g.beginPath(); g.arc(20.7 + o.look * 1.7, 17, r, 0, 7); g.fill();
          g.globalAlpha = 1; g.shadowBlur = 0;
        }
      }
    }
    g.restore();
  }
  g.restore();
}

// ---------- 배경 ----------
function bg(t) {
  const gr = g.createRadialGradient(W * .5, H * .46, 40, W * .5, H * .5, Math.max(W, H) * .75);
  gr.addColorStop(0, '#16224a'); gr.addColorStop(.55, '#0d142b'); gr.addColorStop(1, NAVY);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // 점 격자: 중심에서 퍼지는 신호에 따라 반짝임
  const gap = 64, cx = W / 2, cy = H / 2, wave = (t - 1.9) * 760;
  for (let y = gap / 2; y < H; y += gap) for (let x = gap / 2; x < W; x += gap) {
    const d = Math.hypot(x - cx, y - cy), pulse = Math.exp(-Math.pow((d - wave) / 130, 2)) * (t > 1.9 && t < 4.6 ? 1 : 0);
    const base = .10 + .05 * Math.sin(t * .8 + x * .01 + y * .013);
    g.fillStyle = `rgba(143,216,255,${Math.min(.9, base + pulse * .7)})`;
    const r = 1.6 + pulse * 3.2; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  // 떠다니는 빛 알갱이
  for (let i = 0; i < 46; i++) {
    const sp = .015 + rnd(i) * .03, x = ((rnd(i + 50) + t * sp * .12) % 1) * W, y = H - ((rnd(i + 99) * 1.2 + t * sp) % 1.2) * H * 1.05;
    g.fillStyle = `rgba(190,225,255,${.10 + rnd(i + 7) * .25})`; g.beginPath(); g.arc(x, y, 1.2 + rnd(i + 3) * 2.2, 0, 7); g.fill();
  }
  const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .38, W / 2, H / 2, Math.max(W, H) * .78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// ---------- 글자 한 자씩 솟아오르기 ----------
function reveal(str, x, y, size, weight, color, t0, t, step, align) {
  g.font = `${weight} ${size}px ${FONT}`; g.textBaseline = 'alphabetic';
  const ws = [...str].map((c) => g.measureText(c).width), tot = ws.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? x - tot / 2 : x;
  [...str].forEach((c, i) => {
    const p = prog(t, t0 + i * step, t0 + i * step + .55), e = eOut(p);
    if (p > 0) {
      g.save(); g.globalAlpha = clamp(p * 2.2); g.fillStyle = color; g.translate(cx, y + (1 - e) * size * .55);
      g.rotate((1 - e) * .12 * (i % 2 ? 1 : -1)); g.fillText(c, 0, 0); g.restore();
    }
    cx += ws[i];
  });
  return tot;
}

// ---------- 신호 고리 ----------
function rings(cx, cy, t, size) {
  [1.95, 2.17, 2.39, 4.1].forEach((s, i) => {
    const p = prog(t, s, s + 1.5); if (p <= 0 || p >= 1) return;
    const r = size * (.62 + eExpo(p) * (i === 3 ? 4.2 : 3.4)), a = (1 - p) * (i === 3 ? .35 : .7);
    g.strokeStyle = `rgba(143,216,255,${a})`; g.lineWidth = (1 - p) * 7 + 1.5; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
    if (i < 3) { g.strokeStyle = `rgba(36,86,229,${a * .8})`; g.lineWidth = (1 - p) * 14 + 2; g.beginPath(); g.arc(cx, cy, r * .93, 0, 7); g.stroke(); }
  });
}

// ---------- 파이프라인: 웹캠 AI → 마이크로비트 → 로보독 ----------
function pipeline(cx, cy, t, wTot) {
  const labels = ['웹캠 AI', '마이크로비트', '로보독'], n = 3, gap = wTot / (n - 1);
  const pa = prog(t, 4.0, 4.9);
  if (pa <= 0) return;
  const pos = labels.map((_, i) => cx - wTot / 2 + gap * i);
  // 선
  g.lineCap = 'round';
  for (let i = 0; i < n - 1; i++) {
    const p = eInOut(prog(t, 4.1 + i * .3, 4.7 + i * .3));
    g.strokeStyle = 'rgba(143,216,255,.35)'; g.lineWidth = 4; g.setLineDash([2, 14]);
    g.beginPath(); g.moveTo(pos[i] + 62, cy); g.lineTo(lerp(pos[i] + 62, pos[i + 1] - 62, p), cy); g.stroke(); g.setLineDash([]);
    // 달리는 신호 알갱이
    const q = ((t * .9 - i * .35) % 1 + 1) % 1;
    if (p >= 1 && t > 4.9) { const xx = lerp(pos[i] + 62, pos[i + 1] - 62, q); g.shadowColor = CYAN; g.shadowBlur = 16; g.fillStyle = '#fff'; g.beginPath(); g.arc(xx, cy, 6, 0, 7); g.fill(); g.shadowBlur = 0; }
  }
  labels.forEach((lb, i) => {
    const p = eBack(prog(t, 4.0 + i * .22, 4.6 + i * .22), 2.2);
    if (p <= 0) return;
    g.save(); g.translate(pos[i], cy); g.scale(p, p);
    g.fillStyle = 'rgba(255,255,255,.08)'; g.strokeStyle = 'rgba(143,216,255,.7)'; g.lineWidth = 3; rr(-62, -62, 124, 124, 34); g.fill(); g.stroke();
    g.strokeStyle = CYAN; g.fillStyle = CYAN; g.lineWidth = 6; g.lineCap = 'round'; g.lineJoin = 'round';
    if (i === 0) { // 눈(카메라)
      g.beginPath(); g.ellipse(0, 0, 30, 19, 0, 0, 7); g.stroke(); g.beginPath(); g.arc(0, 0, 9, 0, 7); g.fill();
    } else if (i === 1) { // 마이크로비트 보드
      rr(-32, -22, 64, 44, 8); g.stroke(); g.beginPath(); g.arc(-9, 0, 4, 0, 7); g.fill(); g.beginPath(); g.arc(9, 0, 4, 0, 7); g.fill();
    } else { // 로보독 얼굴
      rr(-32, -20, 64, 40, 18); g.stroke(); g.beginPath(); g.arc(-12, 0, 5, 0, 7); g.fill(); g.beginPath(); g.arc(12, 0, 5, 0, 7); g.fill();
    }
    g.restore();
    g.save(); g.globalAlpha = clamp(p); g.font = `700 32px ${FONT}`; g.fillStyle = '#cfe0ff'; g.textAlign = 'center'; g.fillText(lb, pos[i], cy + 112); g.restore();
  });
}

// ---------- 한 장면 ----------
function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
  // 가상 좌표 → 화면(가운데 정렬, 남는 곳은 배경색으로)
  const ox = (cv.width - W * px) / 2, oy = (cv.height - H * px) / 2;
  g.fillStyle = NAVY; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(px, 0, 0, px, ox, oy); g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();

  // 카메라: 아주 천천히 밀고 들어가다 끝에서 살짝 숨 고르기 (손맛이 나는 미세한 흔들림 포함)
  const zoom = 1 + prog(t, 0, 3.0) * .06 - prog(t, 3.0, 4.2) * .035;
  g.translate(W / 2, H / 2); g.scale(zoom, zoom); g.translate(-W / 2, -H / 2);
  g.translate(Math.sin(t * 1.3) * 2.2, Math.cos(t * 1.1) * 1.6);
  bg(t);

  // 로고 위치: 가운데 → 제목 옆(가로) / 제목 위(세로)
  const move = eInOut(prog(t, 3.0, 3.9));
  const sizeC = portrait ? 560 : 420, sizeF = portrait ? 400 : 300;
  const cx0 = W / 2, cy0 = portrait ? H * .42 : H * .47;
  const fx = portrait ? W / 2 : W * .5 - 560, fy = portrait ? H * .20 : H * .30;
  const lx = lerp(cx0, fx, move), ly = lerp(cy0, fy, move), ls = lerp(sizeC, sizeF, move);

  // 눈 켜짐/움직임
  const badge = eBack(prog(t, .25, 1.05), 1.7);
  const face = eBack(prog(t, .95, 1.5), 1.9);
  const eye = eOut(prog(t, 1.45, 1.75));
  const flash = Math.exp(-Math.pow((t - 1.78) / .10, 2));
  const pupil = prog(t, 1.65, 1.95) + flash * .6;
  let look = 0;
  if (t > 2.05) look = t < 2.35 ? -eOut(prog(t, 2.05, 2.15)) : t < 2.75 ? lerp(-1, 1, eOut(prog(t, 2.35, 2.45))) : lerp(1, 0, eOut(prog(t, 2.75, 2.95)));
  const bl = (s) => { const p = prog(t, s, s + .2); return p <= 0 || p >= 1 ? 0 : Math.sin(p * Math.PI); };
  const blink = Math.max(bl(3.1), bl(4.7));
  const arc = eOut(prog(t, 1.9, 2.3));

  // 배지 뒤 은은한 빛
  const glow = g.createRadialGradient(lx, ly, 10, lx, ly, ls * 1.5);
  glow.addColorStop(0, `rgba(80,140,255,${.38 * badge})`); glow.addColorStop(1, 'rgba(80,140,255,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);
  rings(lx, ly, t, ls);
  // 눈 켜질 때 화면이 한 번 번쩍
  if (flash > .02) { g.fillStyle = `rgba(190,230,255,${flash * .05})`; g.fillRect(0, 0, W, H); }
  logo(lx, ly, ls, { badge, face, eye, pupil: clamp(pupil, 0, 1.4), look, blink, arc });

  // 제목
  const tx = portrait ? W / 2 : W * .5 - 360 + 40, ty = portrait ? H * .50 : H * .39;
  const tsize = portrait ? 170 : 168, al = portrait ? 'center' : 'left';
  if (t > 3.6) {
    const tot = reveal('빅아이 로보독', tx, ty, tsize, 900, '#ffffff', 3.65, t, .07, al);
    // 밑줄: 왼쪽에서 오른쪽으로 그려짐
    const bp = eInOut(prog(t, 4.1, 4.6)), bx = portrait ? W / 2 - tot / 2 : tx;
    g.fillStyle = CYAN; g.shadowColor = CYAN; g.shadowBlur = 18; rr(bx, ty + 34, tot * bp, 8, 4); g.fill(); g.shadowBlur = 0;
    // 부제
    const sp = eOut(prog(t, 3.9, 4.5));
    g.save(); g.globalAlpha = sp; g.font = `600 ${portrait ? 54 : 58}px ${FONT}`; g.fillStyle = '#bcd2ff'; g.textAlign = al;
    g.fillText('× 마이크로비트 · 피지컬 AI 수업', tx, ty + 120 + (1 - sp) * 26); g.restore();
  }
  // 파이프라인
  pipeline(portrait ? W / 2 : W * .5 + 40, portrait ? H * .74 : H * .72, t, portrait ? 760 : 1100);
  // 협력 문구
  const cp = eOut(prog(t, 5.0, 5.6));
  if (cp > 0) { g.save(); g.globalAlpha = cp * .8; g.font = `600 30px ${FONT}`; g.fillStyle = '#9fb4e6'; g.textAlign = 'center'; g.fillText('코코아팹 협력', W / 2, H - (portrait ? 150 : 86)); g.restore(); }

  // 페이드 인(처음)·살짝 질감(필름 그레인 대신 얇은 가로선)
  const fi = 1 - prog(t, 0, .35);
  if (fi > 0) { g.fillStyle = `rgba(11,16,32,${fi})`; g.fillRect(0, 0, W, H); }
  g.restore();
  g.setTransform(1, 0, 0, 1, 0, 0);
}

// ---------- 재생 ----------
const btn = document.getElementById('replay');
let t0 = 0, cur = 0, running = false, frozen = false;
function frame(now) {
  if (!running) return;
  cur = (now - t0) / 1000; if (cur >= DUR) { cur = DUR; running = false; btn.classList.add('on'); }
  render(cur); if (running) requestAnimationFrame(frame);
}
function play() { btn.classList.remove('on'); running = true; t0 = performance.now(); requestAnimationFrame(frame); }
window.__seek = (s) => { running = false; frozen = true; cur = s; render(s); };
btn.onclick = play;
document.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); play(); } });
addEventListener('resize', () => { fit(); render(cur); });
fit();
(async () => {
  try { await Promise.race([Promise.all([document.fonts.load('900 100px "Pretendard Variable"'), document.fonts.load('600 40px "Pretendard Variable"'), document.fonts.load('700 30px "Pretendard Variable"')]), new Promise((r) => setTimeout(r, 1500))]); } catch (e) {}
  if (qs.has('t')) { window.__seek(parseFloat(qs.get('t'))); }
  else if (reduce) { cur = DUR; render(DUR); btn.classList.add('on'); }
  else if (!qs.has('cap')) play();
  else window.__seek(0);
  window.__ready = true;
})();
</script>
</body>
</html>
