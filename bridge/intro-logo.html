<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빅아이 로보독 · 엔딩 모션</title>
<meta name="theme-color" content="#0a2342">
<link rel="stylesheet" href="assets/fonts/pretendard.css">
<style>
  html, body { margin: 0; height: 100%; background: #0a2342; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #replay { position: fixed; right: 16px; bottom: 16px; font: 600 14px "Pretendard Variable", Pretendard, system-ui, sans-serif; color: #fbefc8;
    background: rgba(10,30,60,.35); border: 1px solid rgba(251,239,200,.35); border-radius: 999px; padding: 8px 16px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .4s; }
  #replay.on { opacity: 1; pointer-events: auto; }
  body.cap #replay { display: none; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="달빛 언덕에서 카메라가 보름달로 올라가고, 밤하늘의 별들이 모여 로보독의 LED 눈이 되며, 달 앞에 로보독 머리가 실루엣으로 나타나 두리번거리다 웃는 눈을 짓고 제목 '빅아이 로보독'이 나오는 엔딩 모션"></canvas>
<button id="replay" type="button">다시 보기</button>
<script type="module">
// 엔딩 모션 단독 미리 보기(본체는 ending.js — 첫 화면 index.html에서는 영상 끝에 이어 재생)
// 시험·캡처: ?t=3.2 · window.__seek(초) · ?cap(UI 숨김) · ?from=<이미지 주소> · ?card=0.4(카드 모드 아래 가림 비율)
import { createEnding, DUR, OUT } from './ending.js';
const qs = new URLSearchParams(location.search), btn = document.getElementById('replay');
if (qs.has('cap')) document.body.classList.add('cap');
const card = parseFloat(qs.get('card') || '0');
const end = createEnding(document.getElementById('c'), { inset: () => card });
const img = await new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = qs.get('from') || 'assets/intro/veo-last.webp'; });
await Promise.race([Promise.all(['800 100px', '700 34px', '500 40px'].map((f) => document.fonts.load(f + ' "Pretendard Variable"'))), new Promise((r) => setTimeout(r, 1500))]).catch(() => {});
end.setFrom(img);
const play = () => { btn.classList.remove('on'); end.play(null, { card: card > 0 }); const id = setInterval(() => { if (!end.running) { clearInterval(id); btn.classList.add('on'); } }, 100); };
window.__seek = (s) => end.seek(s);
btn.onclick = play;
addEventListener('resize', () => end.resize());
if (qs.has('t')) end.seek(parseFloat(qs.get('t')));
else if (matchMedia('(prefers-reduced-motion: reduce)').matches) { end.seek(DUR); btn.classList.add('on'); }
else if (!qs.has('cap')) play();
else end.seek(0);
window.__ready = true;
</script>
</body>
</html>
