# Netlify: AI 브리지·시뮬레이터(bridge/)는 정적 사이트, 로보독 도우미는 서버 함수(netlify/functions)
[build]
  publish = "bridge"
  command = ""

# /api/robodog-assistant — Claude API 키(ANTHROPIC_API_KEY)는 Netlify 환경 변수에만 둠
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), serial=(self), usb=(self \"https://makecode.microbit.org\"), microphone=()"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # 보고만 하는(Report-Only) 정책: 막지 않으므로 수업이 깨지지 않음. 브라우저 콘솔의 위반 보고를 보고 다듬은 뒤 Content-Security-Policy 로 바꿀 것
    # MakeCode 편집기(iframe)는 makecode.microbit.org 가 자체 스크립트·확장(github)을 불러옴. 모델·three.js·tf.js는 이 사이트에 포함
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' blob: data: https://makecode.microbit.org https://tfhub.dev https://www.kaggle.com https://storage.googleapis.com; frame-src https://makecode.microbit.org https://makecode.com https://*.makecode.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/model/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 수업 자료의 MakeCode 예제(.ts)는 동영상 형식이 아니라 글자 파일로
[[headers]]
  for = "/docs/makecode/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
