# Netlify: AI 브리지·시뮬레이터(bridge/)는 정적 사이트, 로보독 도우미는 서버 함수(netlify/functions)
[build]
  publish = "bridge"
  command = ""

# /api/robodog-assistant — Claude API 키(ANTHROPIC_API_KEY)는 Netlify 환경 변수에만 둠
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), serial=(self), usb=(self \"https://makecode.microbit.org\"), microphone=()"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/model/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 수업 자료의 MakeCode 예제(.ts)는 동영상 형식이 아니라 글자 파일로
[[headers]]
  for = "/docs/makecode/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
